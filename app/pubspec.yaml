name: lea_app
description: "LEA: Learning Engagement Assistant"
publish_to: 'none'
version: 0.4.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  http: ^1.6.0
  fetch_client: ^1.2.1
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.1.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # All three fonts are variable fonts under the SIL Open Font License (assets/fonts/OFL-*.txt).
  # Weights are applied through the `wght` axis in lib/theme/lea_type.dart.
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Variable.ttf
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
