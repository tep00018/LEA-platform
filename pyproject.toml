[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lea"
version = "0.3.0.dev0"
description = "Learning Engagement Assistant (LEA): an agentic AI tutoring system with Chat, Tutor and Quiz modes"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
authors = [{ name = "Teri Rumble" }]

# Direct runtime dependencies of src/ only. Everything else is resolved by pip.
dependencies = [
    "argon2-cffi>=23.1",            # password hashing
    "chromadb==0.6.3",              # exact: must read the committed AIML101 and DEMO101 stores
    "fastapi>=0.115,<1",            # HTTP API (src/api)
    "google-api-python-client>=2.100",
    "ddgs>=9.0",                    # web_search tool (module name: ddgs)
    "posthog<6",                    # chromadb 0.6.3 telemetry breaks on posthog 6+
    "nltk>=3.9",
    "numpy>=1.26",
    "openai>=1.61,<2",              # code uses the v1 client API
    "openpyxl>=3.1",                # objectives spreadsheet import/export (/teach)
    "pdfminer.six>=20240706",       # content audit: PDFs without a text layer (/teach)
    "pillow>=10.0",
    "pydantic>=2.7,<3",             # typed session models (src/services)
    "python-dotenv>=1.0",
    "python-pptx>=1.0",             # content audit of slide decks (/teach)
    "python-multipart>=0.0.9",      # course file uploads (/teach)
    "redis>=5.0,<6",
    "sentence-transformers>=3.4,<6", # cross-encoder reranker
    "streamlit>=1.42,<2",
    "textblob>=0.19",
    "torch>=2.2",                   # install the CPU build unless you need CUDA
    "uvicorn[standard]>=0.30",      # serves the API
]

[project.optional-dependencies]
# Course onboarding pipeline (data_foundation/)
ingest = [
    "markitdown[docx,pdf,pptx,xlsx]>=0.1",
    "openai-whisper>=20240930",     # also needs the ffmpeg program on PATH
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pdfminer.six>=20240706",
    "pdfplumber>=0.11,<=0.11.4",   # from markitdown[pdf]; 0.11.10 needs Pillow>=12.2, Streamlit needs <12
    "xlsxwriter>=3.2",
]
# RAGAS evaluation scripts (data_foundation/*ragas*.py)
eval = [
    "datasets>=2.19",
    "langchain-openai>=0.3",
    "pandas>=2.0",
    "ragas>=0.2",
]
# Simulation v2 analysis (simulation/): mixed models and figures
sim = [
    "matplotlib>=3.8",
    "statsmodels>=0.14",
]
dev = [
    "fakeredis[lua]>=2.26",
    "httpx>=0.27",                  # FastAPI TestClient
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["data", "tests/fixtures"]  # course material, not LEA code

[tool.ruff.lint]
# Phase 0 gate: real errors only (syntax, undefined names, unused imports/variables,
# redefinitions). Style rules come later, once the code has been restructured.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures shared from another test module are imported, then named as test arguments.
"tests/test_materials_source_api.py" = ["F811"]
