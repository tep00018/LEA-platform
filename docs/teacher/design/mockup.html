<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEA Teacher Screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Lexend:wght@300..600&display=swap">
<style>
:root{
  --c-bg:#F3F2EF; --c-surface:#FFFFFF; --c-ink:#1F1D1B; --c-muted:#6A655F; --c-line:#DEDAD4;
  --c-focus:#2F5FD0; --c-sel:#1F1D1B; --c-onsel:#FFFFFF;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Lexend", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --c-bg:#151412; --c-surface:#1E1C1A; --c-ink:#EEEAE5; --c-muted:#A39C94; --c-line:#34302C;
    --c-focus:#8FB0FF; --c-sel:#EEEAE5; --c-onsel:#151412; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --c-bg:#151412; --c-surface:#1E1C1A; --c-ink:#EEEAE5; --c-muted:#A39C94; --c-line:#34302C;
  --c-focus:#8FB0FF; --c-sel:#EEEAE5; --c-onsel:#151412; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--c-bg); color:var(--c-ink); font-family:var(--body); font-size:15px; line-height:1.5; margin:0;
  padding-inline:clamp(16px,4vw,48px); padding-block:28px 56px}
.page{max-width:1240px; margin:0 auto; display:grid; gap:20px}
h1,h2,h3,h4{font-family:var(--display); text-wrap:balance; margin:0}
.intro{display:grid; gap:6px; max-width:78ch}
.eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--c-muted)}
.intro h1{font-size:clamp(26px,3.4vw,38px); font-weight:750; letter-spacing:-.01em}
.intro p{margin:0; color:var(--c-muted)}
.controls{display:flex; flex-wrap:wrap; gap:12px 22px; align-items:center}
.ctl{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.ctl > span{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--c-muted)}
.seg{display:inline-flex; flex-wrap:wrap; border:1.5px solid var(--c-line); border-radius:18px; padding:3px; background:var(--c-surface); gap:2px}
.seg button{appearance:none; border:0; background:transparent; font:inherit; font-size:13.5px; color:var(--c-ink); padding:6px 13px; border-radius:999px; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c-sel); color:var(--c-onsel)}
button:focus-visible{outline:2px solid var(--c-focus); outline-offset:2px}
.caption{font-size:13.5px; color:var(--c-muted); max-width:92ch; margin:-6px 0 0}
.caption b{color:var(--c-ink); font-weight:500}
.frame{width:100%; border-radius:14px; overflow:hidden; border:1px solid var(--c-line); box-shadow:0 18px 40px -24px rgba(0,0,0,.35); background:var(--c-surface)}
.frame .bar{display:flex; align-items:center; gap:8px; padding:9px 14px; border-bottom:1px solid var(--c-line); font-size:12px; color:var(--c-muted)}
.frame .bar i{width:10px; height:10px; border-radius:50%; background:var(--c-line); display:inline-block}
.frame .bar .url{margin-left:10px; padding:3px 12px; border-radius:6px; background:var(--c-bg)}
.appwrap{height:760px}
body.capture{padding:0; background:transparent}
body.capture .intro, body.capture .controls, body.capture .caption{display:none}
body.capture .page{max-width:none; gap:0}
body.capture .frame{border-radius:0; box-shadow:none; border:0}

/* ============ LEA app: Chalkboard tokens (set by script) ============ */
.app{height:100%; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:14px; overflow:hidden}
.app h2,.app h3,.app h4{font-family:var(--display); color:var(--ink)}
.shell{height:100%; display:grid; grid-template-columns:260px 1fr}
.rail{background:var(--surface); border-right:1px solid var(--line); padding:18px 16px; display:flex; flex-direction:column; gap:14px; min-height:0}
.brand{display:flex; gap:10px; align-items:center}
.brand img{width:44px; height:44px; border-radius:50%; border:2px solid var(--accent)}
.brand b{font-family:var(--display); font-size:22px; font-weight:800; display:block; line-height:1}
.brand span{font-size:11.5px; color:var(--muted)}
.course{border:1px solid var(--line); border-radius:10px; padding:9px 11px; display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--bg)}
.course small,.label{display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.course strong{font-weight:500; font-size:13.5px}
.label{margin-bottom:-6px}
.nav{display:grid; gap:2px; margin:0; padding:0; list-style:none}
.nav a{display:flex; gap:10px; align-items:center; padding:8px 11px; border-radius:10px; font-size:13.5px; color:var(--ink); text-decoration:none}
.nav a svg{width:18px; height:18px; flex:none; color:var(--muted)}
.nav a.on{background:var(--surface-2); font-weight:600}
.nav a.on svg{color:var(--ink)}
.nav a em{margin-left:auto; font-style:normal; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.navlink{display:flex; justify-content:space-between; align-items:center; padding:9px 11px; border-radius:10px; font-size:13.5px; color:var(--ink); text-decoration:none; border:1px solid var(--line)}
.rail .spacer{flex:1}
.who{display:flex; gap:10px; align-items:center; padding-top:12px; border-top:1px solid var(--line); font-size:13px}
.who .av{width:32px; height:32px; border-radius:50%; background:var(--primary); color:var(--on-primary); display:grid; place-items:center; font-weight:600}
.who small{display:block; color:var(--muted); font-size:11.5px}
.work{display:flex; flex-direction:column; min-height:0; min-width:0}
.head{padding:16px 24px 14px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:flex-end; justify-content:space-between; background:var(--bg)}
.kicker{font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); display:flex; gap:4px 10px; flex-wrap:wrap}
.head h2{font-size:24px; font-weight:750; letter-spacing:-.01em; margin-top:3px}
.head .sub{font-size:13px; color:var(--muted); margin-top:2px}
.actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.scroll{flex:1; overflow:auto; min-height:0; padding:18px 24px 24px}
.btn{background:var(--primary); color:var(--on-primary); border:0; border-radius:9px; padding:9px 16px; font:inherit; font-weight:600; font-size:13.5px; white-space:nowrap}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line)}
.btn.danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger)}
.btn.small{padding:6px 12px; font-size:12.5px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px}
.pad{padding:14px 16px}
.grid{display:grid; gap:14px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; padding:2px 9px; border-radius:99px; background:var(--surface-2); color:var(--ink); white-space:nowrap}
.pill.ok{background:var(--success-soft); color:var(--success)}
.pill.bad{background:var(--danger-soft); color:var(--danger)}
.pill.warn{background:var(--accent-soft); color:var(--ink)}
.pill.line{background:transparent; border:1px solid var(--line); color:var(--muted)}
.pill.dash{background:transparent; border:1px dashed var(--muted); color:var(--muted)}
.dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex:none}
.meter{height:6px; border-radius:99px; background:var(--line); overflow:hidden}
.meter i{display:block; height:100%; background:var(--accent); border-radius:99px}
table{width:100%; border-collapse:collapse; font-size:13px}
th{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:500; text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top}
tr:last-child td{border-bottom:0}
td.r, th.r{text-align:right}
.id{font-family:ui-monospace, "JetBrains Mono", Consolas, monospace; font-size:11.5px; color:var(--muted)}
.banner{display:flex; gap:12px; align-items:center; padding:10px 14px; border-radius:10px; font-size:13px}
.banner.info{background:var(--surface-2)}
.banner.soft{background:var(--accent-soft); color:var(--ink)}
.banner.bad{background:var(--danger-soft); color:var(--ink)}
.banner b{font-weight:600}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:14px}
.tabs a{padding:7px 12px; font-size:13.5px; color:var(--muted); text-decoration:none; border-bottom:2.5px solid transparent; margin-bottom:-1px}
.tabs a.on{color:var(--ink); font-weight:600; border-bottom-color:var(--primary)}
.check{width:18px; height:18px; border-radius:50%; display:grid; place-items:center; font-size:11px; flex:none}
.check.done{background:var(--primary); color:var(--on-primary)}
.check.now{background:var(--accent); color:var(--on-primary)}
.check.todo{border:1.5px solid var(--line)}
.log{font-family:ui-monospace, "JetBrains Mono", Consolas, monospace; font-size:11.5px; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; color:var(--muted); line-height:1.6; white-space:pre-wrap}
.field{display:grid; gap:4px}
.field label{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted)}
.input{border:1.5px solid var(--line); border-radius:9px; padding:7px 10px; background:var(--surface); font-size:13.5px}
.twocol{display:grid; grid-template-columns:1fr 330px; gap:16px; align-items:start}
.lo-head{display:flex; gap:10px; align-items:baseline; padding:10px 12px; background:var(--bg); border-bottom:1px solid var(--line)}
.lo-head b{font-weight:600}
.excerpt{font-size:12px; color:var(--muted); border-left:3px solid var(--line); padding-left:8px; margin-top:4px}
.flag{color:var(--warning); font-size:12px}
.stat{display:grid; gap:2px}
.stat b{font-family:var(--display); font-size:26px; font-weight:750; line-height:1.1}
.stat span{font-size:12px; color:var(--muted)}
.bar2{display:flex; height:8px; border-radius:99px; overflow:hidden; background:var(--line)}
.bar2 i{display:block; height:100%}
.finding{display:grid; grid-template-columns:auto 1fr auto; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line)}
.finding:last-child{border-bottom:0}
.sev{width:4px; border-radius:99px}
.quote{font-size:12.5px; background:var(--bg); border-radius:8px; padding:7px 10px; margin-top:6px; color:var(--ink)}
.msg{display:flex; gap:10px; max-width:74ch}
.msg img{width:32px; height:32px; border-radius:50%; flex:none}
.msg .b{background:var(--surface); border:1px solid var(--line); padding:10px 14px; border-radius:4px 14px 14px 14px; line-height:1.55}
.msg .b p{margin:0 0 6px} .msg .b p:last-child{margin:0}
.msg.me{align-self:flex-end; flex-direction:row-reverse}
.msg.me .b{background:var(--primary); color:var(--on-primary); border-color:transparent; border-radius:14px 4px 14px 14px}
.meta{font-size:11.5px; color:var(--muted); margin-top:5px}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0; font-weight:500}
.modes{display:flex; gap:4px; padding:12px 22px 0; border-bottom:1px solid var(--line); background:var(--bg)}
.modes a{padding:8px 14px; font-size:14px; color:var(--muted); text-decoration:none; border-bottom:2.5px solid transparent; margin-bottom:-1px}
.modes a.on{color:var(--ink); font-weight:600; border-bottom-color:var(--primary)}
.preview-bar{display:flex; gap:12px; align-items:center; padding:9px 18px; background:var(--accent-soft); border-bottom:1px solid var(--accent); font-size:13px}
.preview-bar b{font-weight:600}
.preview-bar .actions{margin-left:auto}
.explain{border-left:1px solid var(--line); background:var(--surface); padding:14px 16px; overflow:auto; display:grid; gap:12px; align-content:start}
.explain h4{font-size:15px}
.chunk{font-size:12px; border:1px solid var(--line); border-radius:8px; padding:7px 9px}
.probe{display:flex; gap:8px; align-items:flex-start; font-size:12.5px}
.box{display:flex; gap:8px; align-items:center; background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:6px 6px 6px 14px}
.box span{flex:1; color:var(--muted); font-size:14px}
</style></head><body>

  return `<aside class="rail">
    <div class="brand"><img src="${AV}" alt=""><div><b>LEA</b><span>Teaching</span></div></div>

  </aside>`;
}

}

function curve(){
  const pts=[0.62,0.6,0.61,0.58,0.59,0.57,0.58], pts2=[0.55,0.41,0.33,0.26,0.21,0.18,0.15];
  const x=i=>40+i*62, y=v=>150-v*170;
  const path=p=>p.map((v,i)=>`${i?"L":"M"}${x(i)},${y(v)}`).join(" ");
  return `<svg viewBox="0 0 440 170" style="width:100%;height:auto">
    ${[0,0.25,0.5,0.75].map(v=>`<line x1="40" x2="420" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="4" y="${y(v)+4}" font-size="10" fill="var(--muted)">${Math.round(v*100)}%</text>`).join("")}
    <path d="${path(pts2)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="${path(pts)}" fill="none" stroke="var(--danger)" stroke-width="2.5"/>
    ${pts.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="var(--danger)"/><text x="${x(i)-3}" y="165" font-size="10" fill="var(--muted)">${i+1}</text>`).join("")}
  </svg>`;
}

const ORDER = ["home","setup","kc","publish","videos","videos-edit","audit","analytics","detail","preview","admin"];
const params = new URLSearchParams(location.hash.slice(1));
let screen = params.get("screen") || "home", theme = params.get("theme") || "light";
if (params.has("capture")) document.body.classList.add("capture");

function apply(){
  const app = document.getElementById("app");
  for (const [k,v] of Object.entries(T[theme])) app.style.setProperty(`--${k}`, v);
  app.innerHTML = S[screen].render();
  document.getElementById("caption").innerHTML = S[screen].caption;
  document.getElementById("url").textContent = "localhost:5100" + S[screen].url;
  document.documentElement.dataset.theme = theme;
  document.querySelectorAll("#screens button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.s===screen));
  document.querySelectorAll("#themes button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.t===theme));
}
document.getElementById("screens").innerHTML = ORDER.map(k=>`<button data-s="${k}">${S[k].title}</button>`).join("");
document.getElementById("screens").onclick = e=>{ if(e.target.dataset.s){screen=e.target.dataset.s; apply();} };
document.getElementById("themes").onclick = e=>{ if(e.target.dataset.t){theme=e.target.dataset.t; apply();} };
apply();
</script>
